server:
  port: 8081

spring:
  data:
    redis:
      host: localhost
      port: 6379
hau-mai:
  channel:
    ingest-secret: ${CHANNEL_INGEST_SECRET:}
  zalo:
    app-id: ${ZALO_APP_ID:}
    webhook-secret: ${ZALO_OA_WEBHOOK_SECRET:}
    demo-enabled: ${ZALO_DEMO_ENABLED:false}
    sender: ${ZALO_SENDER:fake}
    access-token: ${ZALO_OA_ACCESS_TOKEN:}
  facebook:
    verify-token: ${FACEBOOK_VERIFY_TOKEN:}
    app-secret: ${FACEBOOK_APP_SECRET:}
    page-id: ${FACEBOOK_PAGE_ID:}
    page-access-token: ${FACEBOOK_PAGE_ACCESS_TOKEN:}
    graph-api-version: ${FACEBOOK_GRAPH_API_VERSION:v26.0}
